name: Deploy

# Deploys to Cloudflare Workers on every push to master, after the tests pass.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The game's own secrets (SESSION_SECRET, JEV_KEY, DISCORD_*) live in Cloudflare
# and are set once with `wrangler secret put`; deploying does not touch them.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the one in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
